<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديو مع الترجمة المتعددة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        .controls-bar {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
        }
        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        select:focus {
            outline: none;
            border-color: #007bff;
        }
        #error-msg {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>الملك أمنمحات الثالث</h2>
    <div class="video-wrapper">
        <video id="myVideo" controls>
            <source src="3rdamenmhat.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
    </div>
    <div id="error-msg">⚠️ تنبيه: تعذر تحميل ملف الفيديو. تأكد أن ملف "3rdamenmhat.mp4" موجود في نفس المجلد وبنفس الاسم.</div>
    
    <div class="controls-bar">
        <label for="subtitlesMenu">اختر لغة الترجمة:</label>
        <select id="subtitlesMenu" onchange="changeSubtitle(this.value)">
            <option value="off">إيقاف الترجمة</option>
            <option value="ar">العربية (Arabic)</option>
            <option value="en">الإنجليزية (English)</option>
        </select>
    </div>
</div>

<script>
    const video = document.getElementById('myVideo');
    const errorMsg = document.getElementById('error-msg');

    // اكتشاف خطأ عدم تحميل الفيديو
    video.addEventListener('error', () => {
        errorMsg.style.display = 'block';
    });

    // مسارات ملفات الترجمة الخارجية
    const subtitleFiles = {
        ar: 'amenemhat_iii.srt',
        en: 'amenemhat_iii_en.srt'
    };

    function changeSubtitle(lang) {
        // إخفاء جميع مسارات الترجمة الحالية
        for (let i = 0; i < video.textTracks.length; i++) {
            video.textTracks[i].mode = 'hidden';
        }
        
        // إزالة عنصر الـ track القديم إن وجد
        const existingTrack = video.querySelector('track');
        if (existingTrack) {
            existingTrack.remove();
        }

        if (lang === 'off') {
            return;
        }

        // جلب ملف الـ SRT الخارجي
        fetch(subtitleFiles[lang])
            .then(response => {
                if (!response.ok) throw new Error("فشل تحميل ملف الترجمة");
                return response.text();
            })
            .then(srtData => {
                const vttData = srtToVtt(srtData);
                const blob = new Blob([vttData], { type: 'text/vtt;charset=utf-8' });
                
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.label = lang === 'ar' ? 'العربية' : 'English';
                track.srclang = lang;
                track.src = URL.createObjectURL(blob);
                track.default = true;
                
                video.appendChild(track);

                // تفعيل الترجمة فور تحميلها
                track.onload = () => {
                    track.track.mode = 'showing';
                };
                
                setTimeout(() => {
                    if (video.textTracks.length > 0) {
                        video.textTracks[video.textTracks.length - 1].mode = 'showing';
                    }
                }, 300);
            })
            .catch(err => console.error("خطأ:", err));
    }

    // دالة لتحويل تنسيق SRT إلى WebVTT بدقة
    function srtToVtt(srt) {
        let vtt = "WEBVTT\n\n";
        let formatted = srt.replace(/\r/g, '');
        formatted = formatted.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
        vtt += formatted;
        return vtt;
    }
</script>

</body>
</html>
